services:
  opencode:
    image: opencode-dev
    command: opencode web --port ${OPENCODE_PORT:-4096} --hostname 0.0.0.0
    ports:
      - "${OPENCODE_BIND:-127.0.0.1}:${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    env_file:
      - .env
    environment:
      - BROWSER=none
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - ROOT_PASSWORD=${ROOT_PASSWORD:?set ROOT_PASSWORD in .env}
    volumes:
      - opencode-data:/home/dev/.local/share/opencode
      - ${PROJECT_DIR:-.}/opencode:/workspace
volumes:
  opencode-data:

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencode-externalsecret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret
    kind: ClusterSecretStore
    namespace: default
  target:
    name: opencode-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENCODE_SERVER_PASSWORD
      remoteRef:
        key: opencode/prod
        property: OPENCODE_SERVER_PASSWORD
    - secretKey: ROOT_PASSWORD
      remoteRef:
        key: opencode/prod
        property: ROOT_PASSWORD
    - secretKey: OLLAMA_API_KEY
      remoteRef:
        key: opencode/prod
        property: OLLAMA_API_KEY
